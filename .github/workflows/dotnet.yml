name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore pipeline/XLSXPipeline.sln

    - name: Build solution
      run: dotnet build pipeline/XLSXPipeline.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test pipeline/XLSXPipeline.Tests/XLSXPipeline.Tests.csproj --no-build --configuration Release --verbosity normal

