name: Create Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    env:
      PROJECT_PATH: ./pipeline/XLSXPipeline/XLSXPipeline.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Extract version from tag
        id: vars
        run: echo "version=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build for Linux x64
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          RID="linux-x64"
          TEMP_PUBLISH_DIR="/tmp/publish_${RID}"
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r ${RID} --self-contained false -p:PublishSingleFile=true -o "${TEMP_PUBLISH_DIR}"

          if [ -d "${TEMP_PUBLISH_DIR}/Examples" ]; then rm -rf "${TEMP_PUBLISH_DIR}/Examples"; fi
          if [ -d "${TEMP_PUBLISH_DIR}/Pipelines" ]; then rm -rf "${TEMP_PUBLISH_DIR}/Pipelines/"*; fi

          ZIP_FILE_PREFIX="xlsx-pipeline"
          ZIP_FILE_NAME="${ZIP_FILE_PREFIX}-${VERSION}-${RID}.zip"

          cd "${TEMP_PUBLISH_DIR}"
          zip -r "${{ github.workspace }}/${ZIP_FILE_NAME}" .
          cd - 

      # --- Build for Linux arm64 (Single Executable, Framework-Dependent) ---
      - name: Build for Linux arm64
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          RID="linux-arm64"
          TEMP_PUBLISH_DIR="/tmp/publish_${RID}"
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r ${RID} --self-contained false -p:PublishSingleFile=true -o "${TEMP_PUBLISH_DIR}"

          if [ -d "${TEMP_PUBLISH_DIR}/Examples" ]; then rm -rf "${TEMP_PUBLISH_DIR}/Examples"; fi
          if [ -d "${TEMP_PUBLISH_DIR}/Pipelines" ]; then rm -rf "${TEMP_PUBLISH_DIR}/Pipelines/"*; fi

          ZIP_FILE_PREFIX="xlsx-pipeline"
          ZIP_FILE_NAME="${ZIP_FILE_PREFIX}-${VERSION}-${RID}.zip"

          cd "${TEMP_PUBLISH_DIR}"
          zip -r "${{ github.workspace }}/${ZIP_FILE_NAME}" .
          cd -

      # --- Build for Windows x64 (Single Executable, Framework-Dependent) ---
      - name: Build for Windows x64
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          RID="win-x64"
          TEMP_PUBLISH_DIR="/tmp/publish_${RID}"
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r ${RID} --self-contained false -p:PublishSingleFile=true -o "${TEMP_PUBLISH_DIR}"

          if [ -d "${TEMP_PUBLISH_DIR}/Examples" ]; then rm -rf "${TEMP_PUBLISH_DIR}/Examples"; fi
          if [ -d "${TEMP_PUBLISH_DIR}/Pipelines" ]; then rm -rf "${TEMP_PUBLISH_DIR}/Pipelines/"*; fi

          ZIP_FILE_PREFIX="xlsx-pipeline"
          ZIP_FILE_NAME="${ZIP_FILE_PREFIX}-${VERSION}-${RID}.zip"

          cd "${TEMP_PUBLISH_DIR}"
          zip -r "${{ github.workspace }}/${ZIP_FILE_NAME}" .
          cd -

      # --- Build for Windows arm64 (Single Executable, Framework-Dependent) ---
      - name: Build for Windows arm64
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          RID="win-arm64"
          TEMP_PUBLISH_DIR="/tmp/publish_${RID}"
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r ${RID} --self-contained false -p:PublishSingleFile=true -o "${TEMP_PUBLISH_DIR}"

          if [ -d "${TEMP_PUBLISH_DIR}/Examples" ]; then rm -rf "${TEMP_PUBLISH_DIR}/Examples"; fi
          if [ -d "${TEMP_PUBLISH_DIR}/Pipelines" ]; then rm -rf "${TEMP_PUBLISH_DIR}/Pipelines/"*; fi

          ZIP_FILE_PREFIX="xlsx-pipeline"
          ZIP_FILE_NAME="${ZIP_FILE_PREFIX}-${VERSION}-${RID}.zip"

          cd "${TEMP_PUBLISH_DIR}"
          zip -r "${{ github.workspace }}/${ZIP_FILE_NAME}" .
          cd -

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xlsx-pipeline-${{ steps.vars.outputs.version }}-linux-x64.zip
            xlsx-pipeline-${{ steps.vars.outputs.version }}-linux-arm64.zip
            xlsx-pipeline-${{ steps.vars.outputs.version }}-win-x64.zip
            xlsx-pipeline-${{ steps.vars.outputs.version }}-win-arm64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}